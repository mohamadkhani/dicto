[workspace]
members = [".", "gpui", "telemetry", "translate"]
resolver = "2"

# Redirect every crate that asks for GPUI from upstream zed-industries/zed to
# the mohamadkhani/zed fork — the same GPUI dependency source LogiGuard uses
# (see Logicamp/logiguard). The fork carries the Wayland fixes Dicto needs:
# 1. `Window::activate_with_token` for externally-minted xdg-activation
#    tokens (tray clicks — see logiguard docs/tray-window-focus-wayland.md)
# 2. xdg-activation keyboard-focus serial handling (wl_keyboard.enter serial
#    on activation tokens — Mutter rejects stale mouse-press serials)
# Without this section, gpui-component (which pins zed-industries/zed) would
# pull a second, unpatched copy of gpui into the graph and the two sources
# would not unify — breaking our call site. Pin to the same rev as
# gpui/Cargo.toml.
[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/mohamadkhani/zed", rev = "c612da6503499b7242ce60e7aa893184d63043ec", version = "=0.2.2" }
gpui_platform = { git = "https://github.com/mohamadkhani/zed", rev = "c612da6503499b7242ce60e7aa893184d63043ec", version = "=0.1.0" }
gpui_macros = { git = "https://github.com/mohamadkhani/zed", rev = "c612da6503499b7242ce60e7aa893184d63043ec", version = "=0.1.0" }
gpui_web = { git = "https://github.com/mohamadkhani/zed", rev = "c612da6503499b7242ce60e7aa893184d63043ec", version = "=0.1.0" }

[package]
name = "mdict-rs"
version = "0.6.1"
authors = ["Mohammadreza Khani"]
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
name = "mdict_rs"
path = "src/lib.rs"

[[bin]]
name = "mdict-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_derive = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
encoding = "0.2"
adler32 = "1"
fst = { version = "0.4", features = ["levenshtein"] }
flate2 = { version = "1", features = ["zlib"], default-features = false }
rand = "0.9"
rust-lzo = "0.6"
ripemd = "0.1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.6", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
memmap2 = "0.9.10"
