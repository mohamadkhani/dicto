[package]
name = "dicto"
version = "0.6.0"
edition = "2024"
authors = ["Mohammadreza Khani"]
license = "AGPL-3.0-or-later"

[dependencies]
mdict-rs = { path = ".." }
dicto-telemetry = { path = "../telemetry" }
dicto-translate = { path = "../translate" }
# GPUI from the mohamadkhani/zed fork of zed-industries/zed — the same
# dependency source LogiGuard uses. The fork carries the Wayland patch
# `Window::activate_with_token(&str)` (xdg_activation_v1 with an
# externally-minted token — consumed by the ksni tray). We pin to a rev so
# the build is reproducible; the workspace root [patch] section redirects
# gpui-component's transitive zed dependency to this same rev. See
# Logicamp/logiguard docs/tray-window-focus-wayland.md.
gpui = { git = "https://github.com/mohamadkhani/zed", rev = "c612da6503499b7242ce60e7aa893184d63043ec" }
gpui_platform = { git = "https://github.com/mohamadkhani/zed", rev = "c612da6503499b7242ce60e7aa893184d63043ec" }
# Bumped to the same gpui-component rev LogiGuard pins — required by the
# newer fork base (older c112e7b used APIs removed upstream after 1d217ee).
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "accb9616263b" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "accb9616263b" }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rodio = { version = "0.20", default-features = false, features = ["mp3", "wav", "vorbis", "flac"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
thiserror = "1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
unicode-bidi = "0.3"

[build-dependencies]
embed-resource = "3.0"

[target.'cfg(target_os = "linux")'.dependencies]
# ashpd shares zbus with gpui_linux (which forces async-io), so we must use the
# async-io feature too — enabling tokio would conflict. The `global_shortcuts`
# feature gates the GlobalShortcuts portal module. Linux-only: the crate
# unconditionally uses `os::unix::ffi` and fails to compile on Windows.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
ksni = { git = "https://github.com/mohamadkhani/ksni.git", tag = "v0.3.5-gnome-activation-token", features = ["tokio"] }
zbus = "5"
futures-util = "0.3"
global-hotkey = "0.5"
gpui_platform = { git = "https://github.com/mohamadkhani/zed", rev = "c612da6503499b7242ce60e7aa893184d63043ec", features = ["font-kit", "wayland", "x11"] }
gtk = "0.18"
x11rb = { version = "0.13", default-features = false }
